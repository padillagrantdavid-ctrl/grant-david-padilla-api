
<!DOCTYPE html>
<html>
<head>
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1, h2 {
            color: #333;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        #result, #greeting, #hobbies {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Student API Interface</h1>
    <p>Welcome to my Flask API Web Interface!</p>

    <!-- STUDENT INFORMATION -->
    <h2>Student Information</h2>

    <button onclick="loadStudent()">
        Load Student Information
    </button>

    <div id="result"></div>

    <hr>

    <!-- GREETING API -->
    <h2>Greeting API</h2>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your first name"
    >

    <button onclick="sayHello()">Say Hello</button>

    <p id="greeting"></p>

    <hr>

    <!-- CUSTOM API: MY HOBBIES -->
    <h2>My Hobbies API</h2>

    <button onclick="loadHobbies()">Load My Hobbies</button>

    <div id="hobbies"></div>

    <script>

        // LOAD STUDENT INFORMATION
        function loadStudent() {
            fetch('/student')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Request failed');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('result').innerHTML =
                    '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                    '<p><b>Name:</b> ' + data.name + '</p>' +
                    '<p><b>Program:</b> ' + data.program + '</p>' +
                    '<p><b>Year:</b> ' + data.year + '</p>' +
                    '<p><b>Section:</b> ' + data.section + '</p>';
            })
            .catch(error => {
                document.getElementById('result').innerText =
                    'Unable to retrieve student information.';
            });
        }


        // GREETING API
        function sayHello() {
            const name = document.getElementById('nameInput').value;

            fetch('/hello?name=' + encodeURIComponent(name))
            .then(response => {
                if (!response.ok) {
                    throw new Error('Request failed');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('greeting').innerText =
                    data.message;
            })
            .catch(error => {
                document.getElementById('greeting').innerText =
                    'Unable to retrieve greeting.';
            });
        }


        // CUSTOM MY HOBBIES API
        function loadHobbies() {
            fetch('/my-hobbies')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Request failed');
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('hobbies').innerHTML =
                    '<p><b>Name:</b> ' + data.name + '</p>' +
                    '<p><b>Hobbies:</b> ' +
                    data.hobbies.join(', ') + '</p>' +
                    '<p><b>Favorite Hobby:</b> ' +
                    data.favorite_hobby + '</p>';
            })
            .catch(error => {
                document.getElementById('hobbies').innerText =
                    'Unable to retrieve hobbies.';
            });
        }

    </script>

</body>
</html>
