
<!DOCTYPE html>
<html>
<head>
    <title>Student Information System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            background: #0879d1;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        .student {
            background: #eeeeee;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
        }

        h1, h2 {
            color: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Information System</h1>

    <h2>Student Information</h2>
    <button onclick="loadStudent()">Load Student Information</button>
    <div id="studentInfo"></div>

    <h2>Greeting API</h2>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="greetStudent()">Say Hello</button>
    <div id="greeting"></div>

    <h2>My Hobbies</h2>
    <button onclick="loadHobbies()">Load My Hobbies</button>
    <div id="hobbies"></div>

    <h2>Students from SQLite Database</h2>
    <button onclick="loadStudents()">Load Students</button>
    <div id="studentList"></div>

    <h2>Search Students by Program</h2>
    <input type="text" id="programInput" placeholder="Enter BSIT or BSCS">
    <button onclick="loadByProgram()">Search Program</button>
    <div id="programResults"></div>

</div>

<script>

function loadStudent() {
    fetch('/student')
    .then(response => response.json())
    .then(data => {
        document.getElementById('studentInfo').innerHTML =
            `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    });
}

function greetStudent() {
    const name = document.getElementById('nameInput').value;

    fetch('/hello?name=' + encodeURIComponent(name))
    .then(response => response.json())
    .then(data => {
        document.getElementById('greeting').innerHTML =
            `<p>${data.message}</p>`;
    });
}

function loadHobbies() {
    fetch('/my-hobbies')
    .then(response => response.json())
    .then(data => {
        document.getElementById('hobbies').innerHTML =
            `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    });
}

function loadStudents() {
    fetch('/students')
    .then(response => response.json())
    .then(data => {
        let output = '';

        data.forEach(student => {
            output += `
                <div class="student">
                    <strong>ID:</strong> ${student.id}<br>
                    <strong>Student ID:</strong> ${student.student_id}<br>
                    <strong>Name:</strong> ${student.name}<br>
                    <strong>Program:</strong> ${student.program}<br>
                    <strong>Year:</strong> ${student.year}<br>
                    <strong>Section:</strong> ${student.section}
                </div>
            `;
        });

        document.getElementById('studentList').innerHTML =
            output || 'No students found.';
    });
}

function loadByProgram() {
    const program = document.getElementById('programInput').value.trim();

    if (!program) {
        document.getElementById('programResults').innerHTML =
            'Please enter a program.';
        return;
    }

    fetch('/students/program/' + encodeURIComponent(program))
    .then(response => response.json())
    .then(data => {
        let output = '';

        data.forEach(student => {
            output += `
                <div class="student">
                    <strong>ID:</strong> ${student.id}<br>
                    <strong>Name:</strong> ${student.name}<br>
                    <strong>Program:</strong> ${student.program}<br>
                    <strong>Year:</strong> ${student.year}<br>
                    <strong>Section:</strong> ${student.section}
                </div>
            `;
        });

        document.getElementById('programResults').innerHTML =
            output || 'No students found.';
    });
}

</script>

</body>
</html>
